name: Headless APK Builder
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Direct Android SDK Compile
        run: |
          # Setup basic clean structures
          mkdir -p src/com/example/offlinecontroller res/xml obj
          
          # Move flat files into compiler alignment mapping locations
          cp AndroidManifest.xml src/
          cp device_admin_policies.xml res/xml/
          cp AdbCommandReceiver.java src/com/example/offlinecontroller/
          
          # Pull down build binaries from Google
          wget -q https://google.com
          unzip -q commandlinetools-linux-*_latest.zip
          yes | cmdline-tools/bin/sdkmanager --sdk_root=sdk "platforms;android-33" "build-tools;33.0.2" > /dev/null
          
          # Compile resource packages and source streams
          sdk/build-tools/33.0.2/aapt package -f -M src/AndroidManifest.xml -S res -I sdk/platforms/android-33/android.jar -F final-unsigned.apk
          javac -d obj -cp sdk/platforms/android-33/android.jar src/com/example/offlinecontroller/*.java
          sdk/build-tools/33.0.2/d8 --output=. obj/com/example/offlinecontroller/*.class --lib sdk/platforms/android-33/android.jar
          zip -quj final-unsigned.apk classes.dex
          
          # Generate signing keystore asset keys and apply package signature
          keytool -genkeypair -alias debugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          sdk/build-tools/33.0.2/apksigner sign --ks debug.keystore --ks-pass pass:android --out HeadlessController.apk final-unsigned.apk

      - name: Upload Final Headless APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadlessControllerAPK
          path: HeadlessController.apk
